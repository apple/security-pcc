syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.apple.keyt.api.at";
option java_outer_classname = "ATServiceProto";

package PrivateCloudCompute.TransparencyLog;

import "Transparency.proto";
import "PrivateCloudComputeEnvironment.proto";

// Protobuf definitions server-to-server Private Cloud Compute API
// Includes:
//   - insert APIs for certificates, attestations, and more
//   - proof API for Thimble nodes

// Unless specified otherwise, all fields with an "Ms" suffix are timestamps specified in milliseconds elapsed since 00:00:00 UTC on January 1, 1970


// ============================ AT Log Insert RPC ===================================== //
// Insert attestations into the private cloud compute AT log

// Insert data can go in one of two sets of fields.
// For extra environment verification, populate the ATInsertData field and leave type, data, and
// unhashedMetadata fields empty (they will be ignored if insertData is set).
// For traditional requests, set type, data, and unhashedMetadata fields with data to insert and
// leave insertData empty.
// version, application, and expiryMs fields must be populated in either case.
message ATLogInsertRequest {
  ProtocolVersion version = 1;
  Application application = 2;

  ATLogDataType type = 3;
  uint64 expiryMs = 4;
  bytes data = 5;
  // additional data available to researchers that will not be hashed or signed by the server
  bytes unhashedMetadata = 6;

  bytes insertData = 7;
  // indicates if this is a seed or other build that may not be trusted by production clients. Only valid when type = RELEASE
  ATReleaseType releaseType = 8;
}

message ATLogInsertResponse {
  // Possible status values: MUTATION_PENDING (success), INTERNAL_ERROR, INVALID_REQUEST
  Status status = 1;

  // we don't do insertion promises for private cloud compute
}

enum ATLogDataType {
  UNKNOWN = 0;
  RELEASE = 1;

  KEYBUNDLE_TGT = 3;
  KEYBUNDLE_OTT = 4;
  KEYBUNDLE_OHTTP = 5;

  SERVER_NODE = 6;

  TEST_MARKER = 100;
}

// Corresponds to the ReleaseType TLS enum. Limited to 256 values.
enum ATReleaseType {
  PRODUCTION = 0;
  SEED = 1;
}

// ============================ AT Log Proof RPC ===================================== //
// Get a proof for a set of attestations from the AT log.
// The inclusion proof will be constructed under a recent milestone root, or will
// include a consistency proof back to a recent milestone root.
//
// This API supports both legacy single requests and new batch requests:
// - Legacy: Use 'dataHash' field for a single proof request
// - Batch: Use 'dataHashes' field for multiple proof requests (up to server-configured limit)
// If both 'dataHash' and 'dataHashes' are specified, 'dataHash' will be ignored.

message ATLogProofRequest {
  ProtocolVersion version = 1;
  Application application = 2;

  // These fields make up the leaf identifier.
  // If the same data has been inserted multiple times, this will return the latest entry.
  // This is the SHA256 hash of the logged data.
  bytes dataHash = 3 [deprecated = true]; // Renamed from "identifier". Previously leaf ID was always the data hash, but now leaf ID can include the releaseType.
  // Release type to query. Depending on server settings it may fall back to another type if the specified type is not found.
  ATReleaseType releaseType = 4;
  // This is a list of SHA256 hashes of the logged data for batch requests.
  // Use this field instead of 'dataHash' for requesting multiple proofs in a single request.
  // All records must be of the same release type.
  // Maximum batch size is configurable on the server, hashes beyond the limit will be ignored.
  repeated bytes dataHashes = 5;

  // Optional root treeId and revision under which the ATLogProofs should be generated.
  // Set to 0 (the default value) for the server to choose the revision.
  // If the requested data exists in the log but not under the requested revision, the response will have status MUTATION_PENDING
  // if tree has rolled, this will return a proof from the retired tree if it is still available (goal is 24 hours)
  uint64 treeId = 6;
  uint64 revision = 7;

  // If this is set, return proof under a milestone (or root if newer than the latest milestone)
  // that includes leaves for all active data hashes of this type and the requested data hash. If
  // preferOldest is not set, return the most recent milestone or newer root that includes all
  // active data hashes for this type.
  // What is an active data hash?  Each data hash represents one item (a release build, key bundle,
  //   server hardware, etc.). When a data hash is published it has an expiration set, it can be
  //   re-published to extend its validity. An active data hash is a data hash that has at least one
  //   leaf that has not yet expired.
  // At this time, UNKNOWN (the default) and RELEASE are the only allowed values for this
  ATLogDataType coveringAll = 8;

  // Return the earliest milestone that includes a non-expired leaf of the requested data hash.
  // If coveringAll is set, return the earliest milestone that includes the requested data hash and
  // non-expired leaves for every data hash of the specified log data type.
  bool preferOldest = 9;

  // Example scenarios for coveringAll and preferOldest.
  // 1. coveringAll=RELEASE, preferOldest=true: Return a proof under the oldest milestone that
  //    includes the oldest unexpired leaves for every release data hash and the oldest unexpired
  //    leaf with the requested data hash. If there is a very new release data hash or the requested
  //    data hash is new, this may still return a root newer than the latest milestone.
  // 2. coveringAll=RELEASE, preferOldest=false: Return a proof under the latest milestone unless
  //    there is a very new release data hash or the requested data hash is new, then return a
  //    root newer than the latest milestone.
  // 5. coveringAll=UNKNOWN, preferOldest=true: Return a proof under the oldest milestone that
  //    includes the oldest unexpired leaf with the requested data hash. If the requested data hash
  //    is new, this may still return a root newer than the latest milestone.
}

message ATLogProofResponse {
  // Possible status values: OK, INTERNAL_ERROR, INVALID_REQUEST, NOT_FOUND, MUTATION_PENDING
  // Other values should be treated as INTERNAL_ERROR
  // NOT_FOUND indicates the value was never inserted
  // MUTATION_PENDING means it has been inserted but hasn't yet sequenced into the log, PAT, and TLT
  // OK will return a full response, other values will only include status
  Status status = 1;
  // Corresponding dataHash from the request to allow association of response records with requested hashes
  bytes dataHash = 2;
  ATLogProofs proofs = 3;

  // Expiry time of the returned leaf. Matches the expiry set in the insert request for this leaf.
  // Also available in proofs.inclusionProof.nodsBytes -> parse as as proto ChangeLogNodeV2 -> value -> parse as TLS ATLeafData -> expiryMs
  // That one is hashed... signed... tree consistency protections..., but this is much easier to access.
  uint64 expiryMs = 4;
}

// Response message for batch log proof requests.
// Contains multiple ATLogProofResponse entries, one for each requested data hash, without ordering guarantee
// Batch response handler should use dataHash in ATLogProofResponse for request/response correlation
// If batch size limit is exceeded, the server will only process and respond to the first N entries up to the limit
// The overall response status indicates the batch operation result:
// - OK: At least one proof was successfully generated
// - INTERNAL_ERROR: Server error occurred
// - INVALID_REQUEST
// Individual response entries may have different statuses (OK, NOT_FOUND, MUTATION_PENDING, etc.)
message ATLogProofBatchResponse {
  // Overall response status
  Status status = 1;
  repeated ATLogProofResponse responses = 2;
}

message ATLogProofs {
  // Inclusion proof for this data if it exists in the AT log.
  LogEntry inclusionProof = 1;
  // If the inclusion proof isn't to a milestone root, this will be included to prove consistency with a recent milestone
  LogConsistency milestoneConsistency = 2;
}

message LogConsistency {
  SignedObject startSLH = 3; // SLH of a milestone root
  SignedObject endSLH = 4; // redundant, matches SLH in inclusionProof
  repeated bytes proofHashes = 5;

  // inclusion proof of the endSLH in the PAT, and the PAT head in the TLT
  LogEntry patInclusionProof = 8;
  LogEntry tltInclusionProof = 9;
}

message ATInsertData {
  bytes data = 1;  // `CloudAttestation` release (ASN.1 serialized), or NSP key bundles (ProtoBuf serialized)
  bytes metadata = 2;  // Researcher metadata like CDN URLs and `darwin-init` config (ProtoBuf serialized)
  ATLogDataType type = 3;  // Transparency entry type
  repeated PrivateCloudCompute.Environment permittedEnvironments = 4;  // Environments the entry can be published to
  repeated AssociatedAsset associatedAssets = 5;  // Assets associated with the insert
}

message AssociatedAsset {
  string identifier = 1;
  string details = 2;
}

// ============================ AT Active Records RPC ===================================== //
// Get a list of non-expired leaves from a specified app, data type, and release type.
// This only returns records that have been sequenced into the AT Log.
// This does not return anything for records in mutation pending state.

message ATActiveRecordsRequest {
  ProtocolVersion version = 1;
  Application application = 2;

  ATLogDataType type = 3;
  // Return records with any of the specified release types.
  // Only valid when type = RELEASE, required when type = RELEASE.
  repeated ATReleaseType releaseType = 4;
}

message ATActiveRecordsResponse {
  // Possible status values: OK, INTERNAL_ERROR, INVALID_REQUEST, NOT_FOUND
  // Other values should be treated as INTERNAL_ERROR
  // NOT_FOUND indicates no matching records exist
  // OK will return a response with at least one leaf, other values will only include status
  Status status = 1;

  // All non-expired leaves with matching type and release type (if applicable).
  repeated Leaf leaves = 3;

  message Leaf {
    NodeType nodeType   = 1; // always NodeType.ATL_NODE (ChangeLogNodeV2 with an ATLeafData struct)
    bytes  nodeBytes    = 2;
    uint64 nodePosition = 3; // in range [0, slh.logSize)

    bytes rawData = 5;
    bytes metadata = 6;
    uint64 expiryMs = 7; // this is the same value as nodeBytes.ChangeLogNodeV2.mutation.ATLeafData.expiryMs
  }
}

// ============================ AT ConsistencyProof RPC =========================== //
// Get a consistency proofs between log revisions. The proof efficiently demonstrates that all
// records in the tree at the first revision are still in the tree at the later revision.

message ATLogConsistencyProofRequest {
  ProtocolVersion version = 1;
  repeated LogConsistencyRequest requests = 2;
  uint64 treeId = 3;
  string requestUuid = 5; // Used for logging, not expected when uuid is passed in headers

  message LogConsistencyRequest {
    uint64 startRevision = 3; // Required, must be >= 0
    uint64 endRevision = 4;   // Required, must be > startRevision
  }
}

message ATLogConsistencyProofResponse {
  Status status = 1;
  // these will be sorted by logId, start revision, end revision
  repeated LogConsistency responses = 3;
  LogType logType = 4;
  Application application = 5;
}
