syntax = "proto3";

package com.apple.cloudboard.shadowtunnel.v1;

// CloudAppRemote service enables proxying CloudBoardApp protocol calls over gRPC
// to a remote implementation, useful for testing and development.
service CloudAppRemote {
  // Warmup is called once during cloud app initialization
  rpc Warmup(WarmupRequest) returns (WarmupResponse);
  
  // Run handles the main request/response streaming for a cloud app invocation
  // Client sends: environment metadata + input data stream
  // Server sends: output data stream
  rpc Run(stream RunRequest) returns (stream RunResponse);
  
  // Teardown is called to gracefully shutdown the cloud app
  rpc Teardown(TeardownRequest) returns (TeardownResponse);
}

// WarmupRequest contains information available at warmup time
message WarmupRequest {
  // Name of the cloud app being shadowed
  string cloud_app_name = 1;
  
  // Launchd job instance UUID (as string representation)
  string launchd_job_instance_uuid = 2;
}

// WarmupResponse acknowledges successful warmup
message WarmupResponse {
  // Whether warmup was successful
  bool success = 1;
  
  // Optional error message if warmup failed
  optional string error_message = 2;
}

// RunRequest is sent by the proxy to the remote cloud app
// The first message MUST contain environment metadata
// Subsequent messages contain input data chunks
message RunRequest {
  oneof payload {
    // First message: environment and metadata
    CloudAppEnvironmentMetadata environment = 1;
    
    // Subsequent messages: input data chunks
    InputDataChunk input_chunk = 2;
    
    // Signal that input stream has ended
    InputStreamEnd input_end = 3;
  }
}

// RunResponse is sent by the remote cloud app back to the proxy
message RunResponse {
  oneof payload {
    // Output data chunk to send back to client
    OutputDataChunk output_chunk = 1;
    
    // Signal that output stream has ended successfully
    OutputStreamEnd output_end = 2;
    
    // Error occurred during processing
    CloudAppError error = 3;
  }
}

// TeardownRequest signals the cloud app to teardown
message TeardownRequest {
}

// TeardownResponse acknowledges teardown completion
message TeardownResponse {
  // Whether teardown was successful
  bool success = 1;
  
  // Optional error message if teardown failed
  optional string error_message = 2;
}

// CloudAppEnvironmentMetadata contains the metadata portion of CloudAppEnvironment
// This excludes non-serializable helpers like pccClient, pirClient, keyDerivation, metrics
message CloudAppEnvironmentMetadata {
  // Client metadata (bundle ID, version, etc.)
  PlaintextMetadata plaintext_metadata = 1;
  
  // Whether the request was bypassed (no actual input data)
  bool request_bypassed = 2;
  
  // Trace context with UInt64 spanID
  TraceContext trace_context = 3;
  
  // Ensemble instance identifier
  EnsembleInstanceId ensemble_instance_id = 4;
  
  // Rack identifier
  string rack_id = 5;
  
  // Launchd job instance UUID (as string representation)
  string launchd_job_instance_uuid = 6;
  
  // List of support apps managed by CloudBoard
  repeated string support_apps = 7;
}

// PlaintextMetadata contains client and request information
message PlaintextMetadata {
  // Client bundle identifier
  string bundle_id = 1;
  
  // Client bundle version
  string bundle_version = 2;
  
  // Feature identifier
  string feature_id = 3;
  
  // Additional client information
  string client_info = 4;
  
  // Workload type identifier
  string workload_type = 5;
  
  // Workload parameters (key -> array of values)
  map<string, WorkloadParameterValues> workload_parameters = 6;
  
  // Unique request identifier
  string request_id = 7;
  
  // Automated device group (for testing/monitoring)
  string automated_device_group = 8;
}

// Wrapper for array of string values in workload parameters
message WorkloadParameterValues {
  repeated string values = 1;
}

// This is mapped from UpdatedTraceContext with UInt64 representation of spanID
// it doesn't need to be called UpdatedTraceContext as no backward compatibility issue exists here
message TraceContext {
  // Trace identifier
  string trace_id = 1;
  
  // Span identifier (as UInt64)
  uint64 span_id = 2;
}

// EnsembleInstanceId identifies an ensemble instance
message EnsembleInstanceId {
  // Ensemble identifier
  string ensemble_id = 1;
  
  // Boot identifier
  string boot_id = 2;
}

// InputDataChunk represents a chunk of input data from the client
message InputDataChunk {
  // Raw data bytes
  bytes data = 1;
}

// InputStreamEnd signals the end of the input data stream
message InputStreamEnd {
}

// OutputDataChunk represents a chunk of output data to send back to client
message OutputDataChunk {
  // Raw data bytes
  bytes data = 1;
}

// OutputStreamEnd signals successful completion of output stream
message OutputStreamEnd {
}

// CloudAppError represents an error that occurred during cloud app execution
message CloudAppError {
  // Error code (application-specific)
  string error_code = 1;
  
  // Human-readable error message
  string error_message = 2;
  
  // Whether the error is retryable
  bool retryable = 3;
}
