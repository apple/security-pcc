/**
 * CloudBoard API
 */
syntax = "proto3";

package com.apple.cloudboard.api.v1;

option java_multiple_files = true;
option java_package = "com.apple.cloudboard.api.v1";

import "google/protobuf/timestamp.proto";
import "RopesCommon.proto";

service CloudBoard {
    rpc InvokeWorkload (stream InvokeWorkloadRequest) returns (stream InvokeWorkloadResponse);
    rpc FetchAttestation (FetchAttestationRequest) returns (FetchAttestationResponse);

    // This RPC should be used instead of FetchAttestation, if the client wants to be notified
    // of the attestation when they change either because of release or expiry automatically
    // instead of polling
    rpc WatchAttestation (WatchAttestationRequest) returns (stream WatchAttestationResponse);

    rpc WatchLoadLevel (LoadRequest) returns (stream LoadResponse);

    // This RPC is available on Trusted Proxy only.
    // The real client of this RPC is Trusted Proxy, but the control is inverted to avoid having to run a gRPC service on ROPES.
    // Trusted Proxy initiates the proxy call by sending an InvokeWorkloadResponse.invoke_proxy_initiate message, and
    // ROPES creates the InvokeProxyDialBack RPC.
    rpc InvokeProxyDialBack (stream InvokeProxyDialBackRequest) returns (stream InvokeProxyDialBackResponse);
}

// See https://www.w3.org/TR/trace-context
message TraceContextV1  {
    option deprecated = true;
    // Request tracking identifier.
    // It is a UUID generated by the client and passed to ROPES through the "apple-request-uuid" header.
    string trace_id = 1;
    // 8-byte identifier generated by ROPES or Trusted Proxy.
    string span_id = 2;
    optional string parent_span_id = 3;
}

message TraceContext  {
  // Request tracking identifier.
  // It is a UUID generated by the client and passed to ROPES through the "apple-request-uuid" header.
  UUID trace_id = 1;
  // 8-byte identifier generated by ROPES or Trusted Proxy.
  fixed64 span_id = 2;
  optional fixed64 parent_span_id = 3;
}

message UUID {
    fixed64 most_sig_bits = 1;
    fixed64 least_sig_bits = 2;
}

// When using InvokeProxyInitiate to request a compute ensemble
// this indicates what sort of reponse bypass should be used (if any)
// the mode should be passed along unmodified in all InvokeWorkloadRequest
// if no value is present then none should be inferred
enum ResponseBypassMode {
    // no bypass is/was requested
    NONE = 0;
    // The compute ensemble should perform bypass
    // based on the ciphersuite used for inbound request
    // (whatever the proxy used to rewrap the DEK)
    // The AEAD key and AEAD Nonce should be calculated by a standardized
    // approach in the proxy and the compute ensemble leader
    MATCH_REQUEST_CIPHERSUITE_SHARED_AEAD_STATE = 1;
}

message InvokeWorkloadRequest {

    message Setup {
    }

    message Terminate {
        enum Code {
            UNDEFINED         = 0;
            FOUND_OTHER_NODE  = 1;
            CLIENT_ABORTED    = 2;
            SERVER_ERROR      = 3;
        }
        Code code = 1;
        optional string reason = 2;
        optional com.apple.ropes.common.v1.ClientTerminate client_terminate = 3;
    }

    message Parameters {
        com.apple.ropes.common.v1.Workload workload            = 1;
        com.apple.ropes.common.v1.DecryptionKey decryption_key = 2;
        string request_id                                      = 3;
        com.apple.ropes.common.v1.TenantInfo tenant_info       = 4;
        bytes one_time_token                                   = 5;

        message TrustedProxyMetadata {
            // Set when response bypass is requested
            optional ResponseBypassMode response_bypass_mode   = 1;
        }

        // The presence of this field indicates that the invoke request is made on behalf of Trusted Proxy.
        optional TrustedProxyMetadata trusted_proxy_metadata   = 6;

        // Whether request bypass is occurring on this specific InvokeWorkloadRequest
        // (so no request_chunk messages will be provided at all to this instance)
        optional bool request_bypassed                         = 7;

        // If present and true, CloudBoard is expected to respond with a NACK
        // (empty REL) and finish the response stream
        optional bool request_nack                             = 8;

        // Opaque non-privacy-sensitive blob passed from the client to Trusted Proxy, for testing purposes.
        optional bytes trusted_proxy_request_payload           = 9;

        oneof trace_context_version {
          TraceContextV1 trace_context_v1 = 10;
          TraceContext trace_context = 11;
        }
    }

    oneof type {
        Setup setup                                   = 1;
        Terminate terminate                           = 2;
        com.apple.ropes.common.v1.Chunk request_chunk = 3;
        Parameters parameters                         = 4;
    }
}

message InvokeWorkloadResponse {

    message SetupAck {
        // When CloudBoard sets the field to true, ROPES sends Terminate message before cancelling the stream of
        // invokeWorkload.
        bool support_terminate = 1;
        // This node supports sending negative acknowledgements in the form of an empty Request Execution Log in
        // response to a setup request if ROPES asks for a NACK via the InvokeWorkloadRequest.Parameters message.
        bool support_nack = 2;
        // This node supports receiving auth tokens even when request bypass is used.
        bool support_auth_token_with_request_bypass = 3;
        // When true cloudboardd supports:
        // ComputeToProxyMessage:
        // - selected_ensemble instead of attestation
        // InvokeProxyInitiate
        // - group_id will be sent
        // - negotiate will be sent
        // - reuse_constraints will be sent if needed
        // ProxyToComputeMessage
        // - selectable_ensembles
        // ComputeToProxyMessage
        // - negotiate_pick
        //
        // In addition CloudBoard will have:
        // Advertised the EnsembleInstanceId in ServiceDiscovery
        // Advertised the rack_id in ServiceDiscovery
        bool support_routing_v2 = 4;

        // When true, CloudBoard supports the new TraceContext format with UUID trace_id
        // and fixed64 span_id fields instead of the deprecated string-based TraceContextV1.
        bool support_tracing_context_v2 = 5;
    }

    message ProxyWorkerError {
        // Should match what was sent in InvokeProxyInitiate
        string task_id = 1;
    }

    oneof type {
        SetupAck setup_ack                                                      = 1;
        com.apple.ropes.common.v1.Chunk response_chunk                          = 2;
        InvokeProxyInitiate invoke_proxy_initiate                               = 3;
        ProxyWorkerError proxy_worker_error                                     = 4;
        com.apple.ropes.common.v1.RequestExecutionError request_execution_error = 5;
    }
}

message FetchAttestationRequest {
}

message FetchAttestationResponse {

    // Represents an attestation/key to be published to clients
    message Attestation {
        bytes attestation_bundle                    = 1;
        google.protobuf.Timestamp next_refresh_time = 2;
        bytes key_id                                = 3;
        google.protobuf.Timestamp expires_after     = 4;
    }

    // Represents an attestation/key that is no longer published to ROPES but that is still accepted by the node
    message UnpublishedAttestation {
        bytes key_id                            = 1;
        google.protobuf.Timestamp expires_after = 2;
    }

    Attestation attestation                                 = 1;
    repeated UnpublishedAttestation unpublished_attestation = 2;
}


message LoadRequest {
}

message LoadResponse {
    uint32 max_batch_size                                = 1;
    uint32 current_batch_size                            = 2;
    uint32 optimal_batch_size                            = 3;
    optional com.apple.ropes.common.v1.Workload workload = 4 [deprecated = true];
}

// During the Pick negotiating cycles the set of possible ensembles is presented
// back and forth (steadily reducing).
// This type not only provides a helpful common message, it also implies
// the semantics of these ensembles, violation of any of these would be deemed
// illegal behaviour.
// 1. They must *exist*
// 2. They must be legal candidates for the relevant InvokeProxyInitiate
// they are for
message EnsembleNegotiation {
    repeated com.apple.ropes.common.v1.EnsembleInstanceId ensembles = 1;
}

// In various places there are "rack_id" values
// These are short opaque identifiers for racks (which will exactly match the
// rack_id present in a ensembles's ServiceDiscovery information and stored within it's
// attestation for verification) IFF it is in the same rack.
// We could make this into a type but that seems like overkill

// initiate a "sub-request" where another PCC ensemble is reserved,
// communication channels are established and it can perform work on behalf of the proxy.
// This is considered part of the original request, it will have the same request_id as that
// of the parent proxies request.
message InvokeProxyInitiate {

    // An expression of the effort involved in this request for general phases
    message Effort {
        // identifier for some aspect of the sub request
        string key =                             1;
        // The privacy transformed value is a value between [0, privacy_transformed_granularity]
        // where noise has been added such that *in the aggregate across a large number of requests*
        // AVG(privacy_transformed/privacy_transformed_granularity) = AVG(ideal_percentage)
        uint32 privacy_transformed_numerator    = 2;
        // This is guaranteed to be a number of form (2^n)-1 in range [1, MaxGranularity]
        // so the granularities are always nested.
        // MaxGranularity is guaranteed not to increase without agreement with all parties
        // The current agreed value is 31.
        uint32 privacy_transformed_denominator = 3;
        // The ideal calculation, beween 0 and 1.0, of the effort involved.
        // This may be present if not using customer policy, useful for logging
        // and analysis of the impact of the privacy preserving transform
        optional double ideal_percentage      = 4;
    }

    // This describes how ROPES may behave in attempting to select an ensemble
    // (technically the leader of the ensemble).
    message NegotiateEnsembleChoice {

        // Expresses how a ensemble selection negotiation will work
        message Pick {
            // ROPES must provide this many choices of ensemble to us as a EnsembleNegotiation.
            // reservation of those ensembles is optional
            uint32 num_provided_choices = 1;
            // The number of instances from num_provided_choices the Trusted Proxy will
            // accept as okay and return. ROPES then reserves any of those and returns it
            // to us as normal.
            // During this process, if any of the other legal choices outside of Pick become
            // available (for example trusted_ensembles) ROPES may simply reserve one of them
            // instead and communicate that as the chosen ensemble as normal
            uint32 num_selected_choices = 2;
        }

        // ROPES may choose any of these ensembles, reserve it, and hand it to the proxy
        // if it satisfies the primary workload constraints.
        // If ReuseConstraints are also present (see below) and these ensembles
        // would also conform to the workload_additions they are candidates for reuse
        // too, but their presence here does not guarantee that in any way.
        repeated com.apple.ropes.common.v1.EnsembleInstanceId trusted_ensembles = 1;

        // Ensembles advertising these rack_id can be consider trusted (ROPES may select and reserve
        // only one and return it to us)
        // It is possible for this to be present without any ReuseConstraints, or for the
        // rack_id within ResuseConstraints to not be present in this list (determining this is enforcement
        // within the control of the proxy).
        // If any value is present here any ensemble within those racks is a candidate to be immediately
        // reserved and selected by ROPES without any further negotiation, if it conforms to the primary
        // workload constraints. As with trusted_ensembles they may also conform to reuse (if present)
        // but verifying that is up to ROPES.
        // Just because this list is present does NOT mean it is the optimal routing decision to use it.
        // If actual reuse can be achieved through ReuseConstraints.rack_id then using that might be better
        // (especially if trusted_ensembles contains such a candidate).
        // If no reuse occurs then it will not matter for this  indicates trust is retained regardless, but if not present regardless of
        // the presence of rack_id in ReuseConstraints no racks are considered automatically trusted
        // may be selected by ROPES without any prior negotiation with the Proxy
        // as compared to, say, the 'pick' path
        repeated string trusted_rack_ids                      = 3;

        // IFF true then ROPES can select *any* legal ensemble (that conforms to the constraints of the request)
        // reserve it, and inform us of the choice.
        bool free_choice                                      = 4;

        // A means to negotiate selection of a ensemble without ROPES getting to pick it precisely.
        // If nil then such a negotiation is not permitted.
        // Important note:
        // It is entirely possible that free_choice is false, trusted_rack_ids is empty and pick nil,
        // at that point stage the TrustedProxy is only willing to reuse previously trusted ensembles
        // and must wait for them.
        // IF ROPES cannot do this (all have been rebooted/lost) it should indicate an error.
        // It should indicate a different error for a timeout verses "this will never work"
        optional Pick pick                                    = 5;
    }

    message ReuseConstraints {
        // The holder of the state we wish to reuse, if this instance of the ensemble
        // is no longer available in any way in this cell (say it restarted) then the entireity
        // of this ReuseConstraints message is irrelevant and should be disregarded.
        //
        // If it is present (and available) then choosing it again is almost certainly the most
        // optimal routing decision for this InvokeProxyInitiate sub request.
        // Even if it is not picked exactly other fields indicate if it's still valid to
        // consider reuse to occuring.
        com.apple.ropes.common.v1.EnsembleInstanceId ensemble = 1;
        // if set, and choosing ensemble is not possible, then the next most optimal
        // choice is to pick an ensemble in this rack (which will be in the same rack
        // as the ensemble in field 1).
        // This avoids ROPES having to maintain that mapping itself.
        // This does NOT mean NegotiateEnsembleChoice.trusted_rack_ids will contain it
        // (though that is likely)
        optional string rack_id                               = 2;

        // IFF this reuse constraint applies (which means that the indicated ensemble instance exists),
        // these workload values should be included in the selection criteria/parameters for resolving
        // this initiate sub request, and should also be included in the compute ensemble leader's
        // parameters message.
        com.apple.ropes.common.v1.Workload workload_additions = 3;
    }

    string task_id = 1; // Unique identifier generated by Trusted Proxy.

    // Provides a generalised means to communicate key value pairs between the proxy cloud app, ROPES and
    // the cloud-app on the compute ensemble leader.
    // These can be interpreted as constraints/hints by ROPES, and also provide a channel to communicate
    // untrusted pieces of information to the compute ensemble.
    // Crucially these are untrusted, but can be used even if request bypass is in use, when no direct
    // channel exists from the proxy to the cloud app.
    // If reuse_constraints is present, and applies, these are merged with any additions in
    // ReuseConstraints.workload_additions
    com.apple.ropes.common.v1.Workload workload = 2;
    optional ResponseBypassMode response_bypass_mode = 3;

    // Ask ROPES to forward the request chunks from the client to the compute ensemble leader.
    // This requires Trusted Proxy to operate in "request bypass" mode. Also, Trusted Proxy
    // may send multiple InvokeProxyInitiate messages (e.g. for FT and ET) but this flag
    // can only be set once.
    bool forward_bypassed_request_chunks = 4;

    // An expresion of the effort involved in this sub request
    // Note: this is *not* conditional, is is done on the basis that reuse_constraints
    // have a high probability of succeeding.
    repeated Effort efforts = 6;

    // Identifier generated by the proxy app which allows linking multiple sub requests.
    // which are a sequence such that ROPES can ensure that a decision made about what to do on
    // a previous one is reflected in the later ones.
    // The canonical example is ROPES deciding a inference request should be performed as a
    // "split" FT then ET. The first ensemble was told to perform just FT, so the next
    // sub request should be done as ET.
    // ROPES is expected to maintan the state needed to deal with this, the group_id just makes
    // the causal chain presence explicit
    string group_id = 7;

    // What options ROPES has in selecting the ensemble such that the TrustedProxy will approve that selection
    // if not present the prior semantics (equivalent to "free_choice = true" should be used
    optional NegotiateEnsembleChoice negotiate = 8;

    // A description of how reuse of some prior state may be enabled, and what to do if it is
    // if nil no reuse considerations apply.
    optional ReuseConstraints reuse_constraints = 9;

    oneof trace_context_version {
      TraceContextV1 trace_context_v1 = 5;
      TraceContext trace_context = 10;
    }

    // OTT sent by trusted proxy node to ROPES in order to support rate limiting on subrequests
    bytes one_time_token = 11;

    // When the flag is set, it indicates the request failure can be non-fatal for user experience
    // The non-fatal error will occur when ROPES rejects the request due to utilization thresholds
    // Most other non-retryable failures would still be fatal
    // ROPES can reject the request even when the capacity is not full
    bool is_discardable = 12;
}

message InvokeProxyDialBackRequest {
    message Initiate {
        string task_id = 1;
        oneof trace_context_version { // trace_context.span_id == task_id
          TraceContextV1 trace_context_v1 = 2;
          TraceContext trace_context = 3;
        }
    }
    message Close {
        // This message indicates that there are no more ComputeToProxyMessage messages.
        // If grpc_status is non-zero, an error has happened on either the compute ensemble or at ROPES.
        // If ropes_error_code is provided, a ROPES error occured, grpc_status is set accordingly and
        // an additional error description is provided is provided in ropes_error_description.
        //
        // If ropes_error_code is not provided, grpc_status contains the status returned by the compute
        // ensemble and optionally a GRPC message returned by the ensemble in grpc_message.
        int32 grpc_status = 1;
        optional string grpc_message = 2;
        optional uint32 ropes_error_code = 3;
        optional string ropes_error_description = 4;
    }
    oneof type {
        string task_id = 1 [deprecated = true]; // Moved to Initiate
        Initiate initiate = 4;
        ComputeToProxyMessage compute_to_proxy_message = 2;
        Close close = 3;
    }
}

message InvokeProxyDialBackResponse {
    message Close {
        // This message indicates that there are no more ProxyToComputeMessage messages.
        // Because of the inverted control, we cannot have the server (Trusted Proxy) close the stream because
        // the client would stop sending ComputeToProxyMessage messages and would reset the stream.
    }
    oneof type {
        ProxyToComputeMessage proxy_to_compute_message = 1;
        Close close = 2;
    }
}

// Trusted Proxy -> ROPES
message ProxyToComputeMessage {
    oneof type {
        com.apple.ropes.common.v1.DecryptionKey decryption_key = 1;
        com.apple.ropes.common.v1.Chunk request_chunk = 2;
        // The TrustedProxy will respond to ComputeToProxyMessage.EnsembleNegotiation
        // with a sub set of the presented ensembles for ROPES to select a single instance
        EnsembleNegotiation selectable_ensembles = 3;
    }
}

// ROPES -> Trusted Proxy
message ComputeToProxyMessage {
    /// ROPES has chosen and reserved a specific ensemble for the Initiate request
    message SelectedEnsemble {
        // the attestation for the ensemble leader
        com.apple.ropes.common.v1.Attestation attestation = 1;
        // The workload which was presented to the compute ensemble leader, including any edits
        // performed by ROPES. For example:
        // * If ROPES injects the "run_mode" to indicate the FT/ET/FT_ET operating mode the compute ensemble should use.
        // * if the reuse_constraints were merged in those should be present.
        com.apple.ropes.common.v1.Workload compute_ensemble_workload = 2;
    }

    oneof type {
        // deprecated - replaced by selected_ensemble
        // It may still be sent by ROPES, but not if selected_ensemble
        // will be sent.
        com.apple.ropes.common.v1.Attestation attestation = 1;
        // The encrypted data path from the compute ensemble leader to the proxy
        // (Anything sent to the client's application response stream does not get to this point)
        com.apple.ropes.common.v1.Chunk response_chunk = 2;
        // ROPES is performing a negotiation in response to a NegotiateEnsembleChoice.Pick
        // this should result in a ProxyToComputeMessage.EnsembleNegotiation
        EnsembleNegotiation negotiate_pick = 3;
        // which ensemble was selected, and some meta data about it
        SelectedEnsemble selected_ensemble = 4;
    }
}

message WatchAttestationRequest {
}

message WatchAttestationResponse {

    message AttestationMetadata {
        message Release {
            // hex-encoded SHA256 digest of a transparency log entry/release that uniquely identifies
            // a release associated with an attestation. Compute ensembles announce the
            // release they are running to Service Discovery using the same digest.
            string digest = 1;
        }

        bytes key_id = 1;
        // One or more compute ensemble releases associated with the attestation
        // Currently only ever used by proxy nodes
        repeated Release supported_release = 2;
        // The attestation hard expires at this point
        // there is no point passing a request using it to this node
        google.protobuf.Timestamp expires_after = 3;
    }

    // Represents an attestation/key to be published to clients
    message ActiveAttestation {
        bytes attestation_bundle = 1;
        AttestationMetadata attestation_metadata = 2;
    }

    message AttestationSet {
        ActiveAttestation active_attestation = 1;

        // Represents attestations that are no longer published to
        // ROPES but that are still accepted by the node
        repeated AttestationMetadata unpublished_attestations = 2;
    }

    message AttestationRevocation {
        bytes key_id = 1;
        bytes revocation = 2;
        google.protobuf.Timestamp expiration_time = 3;
    }

    oneof type {
        AttestationSet attestion_set = 1;
        AttestationRevocation attestation_revocation = 2;
    }
}
