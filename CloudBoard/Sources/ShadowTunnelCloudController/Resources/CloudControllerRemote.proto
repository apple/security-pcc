syntax = "proto3";

package com.apple.cloudboard.shadowtunnel.controller.v1;

// ControllerRemote service enables proxying CloudCoardController related protocol calls over gRPC
// to a remote implementation, useful for testing and development.
service ControllerRemote {    
    // Called once on controller startup
    rpc Startup(StartupInfo) returns (StartupResponse);
    
    // Run handles the main request/response streaming for a cloud app invocation
    // Client sends: environment metadata + input data stream
    // Server sends: output data stream
    rpc Run(stream StateTransition) returns (stream ControllerEvent);
}

// WarmupRequest contains information available at warmup time
message StartupInfo {
    // Name of the cloud app being shadowed
    string cloud_app_name = 1;
    
    // UUID (as string representation) idenfier for the controller
    string instance_uuid = 2;
}

// StartupResponse acknowledges successful startup
message StartupResponse {
    // Whether startup was successful
    bool success = 1;
    
    // Optional error message if failed
    optional string error_message = 2;
}

// RunRequest is sent by the proxy to the remote cloud app
// The first message MUST contain environment metadata
// Subsequent messages contain input data chunks
message StateTransition {
    oneof payload {
        // connected to cloudboardd
        // Expect a registerWorkload and updateHealth response as a result
        Connected connected = 1;
        
        // Disconnected from cloudboardd
        // No action required till Connected
        Disconnected disconnected = 2;
    }
}

// ControllerEvent is sent by the remote to the tunnel to act on
message ControllerEvent {
    oneof payload {
        // Output data chunk to send back to client
        RegisterWorkload workload = 1;
        
        // Signal that output stream has ended successfully
        UpdateHealthStatus update_health_status = 2;
    }
}

// Connected signals the controller to register the workload, and set the health status
message Connected {
}

// Disconnected signals the controller lost connection to cloudboardd
message Disconnected {
}

// UpdateHealthStatus triggers a state update
message UpdateHealthStatus {
    WorkloadControllerState state = 1;
}

message WorkloadControllerState{
    oneof payload {
        Initializing initializing = 1;
        Ready ready = 2;
        Busy busy = 3;
        Error error = 4;
    }
}

message Initializing {
}

message Ready {
}

message Busy {
    optional string reason = 1;
}

message Error {
    optional string message = 1;
}


// RegisterWorkload contains the information the remote is allowed to control on registerWorkload
// It flattens out thjose parts of WorkloadConfig and WorkloadProperties that the remotye may control
message RegisterWorkload {
    // WorkloadProperties.workloadName
    string workload_name = 1;
    
    // WorkloadConfig.workloadTags
    // (string -> string OR array of string)
    map<string, RoutingTagValue> workload_tags = 6;
    
    int32 max_batch_size = 3;
    
    int32 optimal_batch_size = 4;
    // no point defining current_batch_size, it is ignored
}

message RoutingTagValueList {
    repeated string values = 1;
}

message RoutingTagValueSingle {
    string value = 1;
}

message RoutingTagValue {
    oneof payload {
        RoutingTagValueSingle single = 1;
        RoutingTagValueList list = 2;
    }
}
