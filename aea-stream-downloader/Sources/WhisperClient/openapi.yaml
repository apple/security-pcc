          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - Policies
      summary: deletes a policy.
      operationId: DeletePolicy
      responses:
        "204":
          description: A successful response.
          content: { }
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Policy with the give name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/policies/{policy_name}/secrets:
    parameters:
      - name: policy_name
        in: path
        description: name of the policy.
        example: myPolicy
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/PolicyName'
      - $ref: '#/components/parameters/namespaceParam'
    get:
      tags:
        - Policies
      summary: Lists secrets associated with a given policy.
      operationId: ListsSecretsForPolicy
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                x-content-type: application/json
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin/auditor role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Policy with the give name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
components:
  schemas:
    VersionResponse:
      type: object
      properties:
        version:
          type: string
      example:
        version: 1.13.0
    StatusResponseResult:
      type: object
      properties:
        healthy:
          type: boolean
        time:
          type: integer
          format: int64
        duration:
          type: integer
          format: int64
        timestamp:
          type: string
      example:
        cassandraStatus:
          healthy: true
          time: 1670304166670
          duration: 18
          timestamp: "2022-12-06T05:22:46.670Z"

    NamespaceListItem:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/NamespaceName'
      example:
        name: myNamespace

    runtimeError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
        code:
          type: integer
          format: int32
        message:
          type: string
      example:
          "code": XXX,
          "message": "Error message"

    AddPrincipalToBucketRequest:
      type: object
      properties:
        entityName:
          $ref: '#/components/schemas/PrincipalName'
        bucketName:
          $ref: '#/components/schemas/BucketName'
      required:
        - entityName
        - bucketName
      example:
        entityName: aprn:apple:certmgr:::group-v2:/ig/11111111/uv/
        bucketName: myBucket
    AddSecretToBucketRequest:
      type: object
      properties:
        entityName:
          $ref: '#/components/schemas/SecretName'
        bucketName:
          $ref: '#/components/schemas/BucketName'
      required:
        - entityName
        - bucketName
      example:
        entityName: mySecret
        bucketName: myBucket
    ListBucketItem:
      type: object
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        name:
          $ref: '#/components/schemas/BucketName'
        description:
          $ref: '#/components/schemas/Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdBy:
          type: string
          description: Name of the principal that created the bucket.
        createdAt:
          type: integer
          format: int64
          description: Bucket creation timestamp.
        updatedBy:
          type: string
          description: Name of the principal that last updated the bucket.
        updatedAt:
          type: integer
          format: int64
          description: Last bucket update timestamp.
      example:
        namespace: myNamespace
        name: myBucket
        description: Bucket containing secrets For myApplication.
        metadata: "{}"
        createdBy: aprn:apple:certmgr:::group-v2:/ig/222222/uv/
        createdAt: 1528482268165
        updatedBy: aprn:apple:certmgr:::group-v2:/ig/222222/uv/
        updatedAt: 1528482269165
    CreateBucketRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/BucketName'
        description:
          $ref: '#/components/schemas/Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - name
      example:
        name: myBucket
        description: "Just a regular, run-of-the-mill bucket"
        metadata: "{}"
    CreateSecretRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SecretName'
        description:
          $ref: '#/components/schemas/Description'
        content:
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
          format: byte
          # 1048576 * 4/3
          maxLength: 1398101
          description: |-
            Content is the base64 of the secret. It can only be omitted if request has a policy of type SECRET_GENERATION in policies field. 
            If both are present, content will take precedence.

            Example:
            > echo 'sup3r-s3cr3t-p4ssw0rd' | base64
            c3VwM3ItczNjcjN0LXA0c3N3MHJkCg==
        metadata:
          $ref: '#/components/schemas/Metadata'
        buckets:
          type: array
          items:
            type: string
          description: List of pre-existing buckets the secret should be assigned to upon creation. Any bucket found to be not existing will be ignored.
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyName'
          description: List of pre-existing Policies the secret should be governed by upon creation.
      required:
        - name
      example:
        name: mySecret
        description: "Just a regular, run-of-the-mill secret"
        content: c3VwM3ItczNjcjN0LXA0c3N3MHJkCg==
        metadata: "{}"
        buckets: ["myBucket"]
        policies: ["myPolicy"]
    MySecretResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SecretName'
        secret:
          description: |-
            Base64-encoded content of the secret.
            > echo "c3VwM3ItczNjcjN0LXA0c3N3MHJkCg==" | base64 --decode
            sup3r-s3cr3t-p4ssw0rd
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
          format: byte
        secretLength:
          type: integer
          format: int32
          description: length of the value of secret field.
        version:
          type: integer
          format: int64
          description: version number of the Secret content.
        creationDate:
          type: string
          format: date-time
          description: creation date of the secret.
        updateDate:
          type: string
          format: date-time
          description: Date of the last update made to the secret.
        metadata:
          $ref: '#/components/schemas/Metadata'
      example:
        name: mySecret
        secret: c3VwM3ItczNjcjN0LXA0c3N3MHJkCg==
        secretLength: 22
        version: 0
        creationDate: 2018-06-08T17:34:34.654Z
    MySecretsResponseItem:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/SecretName'
        currentVersion:
          type: integer
          format: int64
          description: Current version of the secret.
        metadata:
          $ref: '#/components/schemas/Metadata'
        creationDate:
          type: string
          format: date-time
          description: creation date of the secret.
        updateDate:
          type: string
          format: date-time
          description: Date of the last update made to the secret.
      example:
        name: mySecret
        metadata: "{}"
        creationDate: 2018-06-08T17:34:34.654Z

    MySecretsBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MySecretResponse'
          description: List of secrets.
        limit:
          type: integer
          format: int32
          description: Maximum number of secrets that user requested.
        _links:
          type: object
          properties:
            self:
              type: string
              description: URL to get the returned list of secrets again.
            next:
              type: string
              description: URL to get the next set of secrets.
      example:
        results:
          - name: "d1769a6a-c538-44bd-bcf7-738def8fe8ba"
            secret: "c3VwM3ItczNjcjN0LXA0c3N3MHJkCg=="
            secretLength: 22
            creationDate: "2022-12-05T18:44:42.816Z"
            metadata: "{}"

          - name: "16c23dda-820d-4497-b003-e0426b99f138"
            secret: "c3VwM3ItczNjcjN0LXA0c3N3MHJkCg=="
            secretLength: 22
            creationDate: "2022-12-05T18:44:45.921Z"
            metadata: "{}"
        limit: 2
        _links:
          self: "https://whisper.iss.apple.com/v1/my-secrets-batch?offset=0&limit=2"
          next: "https://whisper.iss.apple.com/v1/my-secrets-batch?offset=1&limit=2"

    ReadBucketResponse:
      type: object
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        name:
          $ref: '#/components/schemas/BucketName'
        description:
          $ref: '#/components/schemas/Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdBy:
          type: string
          description: Name of the principal that created the Bucket.
        createdAt:
          type: integer
          format: int64
          description: Bucket creation timestamp.
        updatedBy:
          type: string
          description: Name of the principal that last updated the bucket.
        updatedAt:
          type: integer
          format: int64
          description: Last bucket update timestamp.
        secrets:
          description: List of secrets assigned to the bucket.
          type: array
          items:
            $ref: '#/components/schemas/SecretName'
        principals:
          type: array
          items:
            type: string
            description: List of principals assigned to the buckets. Only these principals can read secret contents.
      example:
        namespace: myNamespace
        name: myBucket
        description: Automatically created.
        createdAt: 1528482268165
        createdBy: 'aprn:apple:certmgr:::group-v2:/ig/111111/uv/'
        secrets:
          - mySecret
        principals:
          - 'aprn:apple:certmgr:::group-v2:/ig/222222/uv/'
        metadata: "{}"

    DescribeNamespaceResponse:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/NamespaceName'
        description:
          $ref: '#/components/schemas/Description'
        secretsCount:
          type: integer
          format: int32
          description: Number of secrets in the Namespace.
        bucketsCount:
          type: integer
          format: int32
          description: Number of buckets in the Namespace.
        dekVersion:
          type: integer
          format: int32
          description: version of the Server managed Data encryption key used to encrypt secrets in a Namespace.
        createdBy:
          type: string
          description: Name of the principal that created the Namespace.
        createdAt:
          type: integer
          format: int64
          description: Namespace creation timestamp.
        updatedBy:
          type: string
        updatedAt:
          type: integer
          format: int64
          description: Namespace last update timestamp.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBinding'
          description: List of Role Bindings for the namespace.
      example:
        name: "myNamespace"
        secrets: 1
        buckets: 1
        dekVersion: 0
        createdBy: "aprn:apple:certmgr:::group-v2:/ig/1111111/uv/"
        createdAt: 1528482268165
        updatedBy: 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/'
        updatedAt: 1528482269165
        roles: [
            {
               name: "admin",
               principals: [ 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/' ]
            }
        ]
    ReadSecretResponse:
      type: object
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        name:
          $ref: '#/components/schemas/SecretName'
        description:
          $ref: '#/components/schemas/Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
        createdAt:
          type: integer
          format: int64
          description: Secret Creation timestamp.
        createdBy:
          type: string
          description: Name of the principal that created the Secret.
        updatedAt:
          type: integer
          format: int64
          description: Secret update timestamp.
        updatedBy:
          type: string
          description: Name of the principal that last updated the Secret.
        currentVersion:
          type: integer
          format: int64
          description: Current version of the secret.
        buckets:
          type: array
          items:
            type: string
          description: List of buckets the secret is assigned to.
        principals:
          type: array
          items:
            type: string
          description: Complete list of principal names that can read the secret.
        policies:
          description: List of policies the secret is governed by.
          type: array
          items:
            $ref: '#/components/schemas/PolicyName'
      example:
        namespace: "1227495"
        name: mySecret
        createdAt: 1528479274654
        createdBy: 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/'
        updatedAt: 1528482268165
        updatedBy: 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/'
        currentVersion: 0
        metadata: "{}"
        buckets:
          - myBucket
        principals:
          - 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/'
    RemovePrincipalFromBucketRequest:
      type: object
      properties:
        entityName:
          $ref: '#/components/schemas/PrincipalName'
        bucketName:
          $ref: '#/components/schemas/BucketName'
      required:
        - entityName
        - bucketName
      example:
        entityName: 'aprn:apple:certmgr:::group-v2:/ig/1111111/uv/'
        bucketName: myBucket
    RemoveSecretFromBucketRequest:
      type: object
      properties:
        entityName:
          $ref: '#/components/schemas/SecretName'
        bucketName:
          $ref: '#/components/schemas/BucketName'
      required:
        - entityName
        - bucketName
      example:
        entityName: mySecret
        bucketName: myBucket
    ListSecretItem:
      type: object
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        name:
          $ref: '#/components/schemas/SecretName'
        description:
          $ref: '#/components/schemas/Description'
        metadata:
          $ref: '#/components/schemas/Metadata'
        currentVersion:
          type: integer
          format: int64
          description: Current version of the secret content.
        createdBy:
          type: string
          description: Name of the principal that created the Secret.
        createdAt:
          type: integer
          format: int64
          description: Secret creation Timestamp.
        updatedBy:
          type: string
          description: Name of the Principal that last updated the Secret.
        updatedAt:
          type: integer
          format: int64
          description: Secret last update timestamp.
      example:
        namespace: myNamespace
        name: mySecret
        currentVersion: 0
        createdBy: aprn:apple:certmgr:::group-v2:/ig/8143122/uv/
        createdAt: 1528479274654
        metadata: "{}"
    ListSecretVersionsItem:
      type: object
      properties:
        secretName:
          $ref: '#/components/schemas/SecretName'
        version:
          type: integer
          format: int64
          description: version number of the Secret content.
        createdBy:
          type: string
          description: Name of the principal that created the Secret content corresponding to the version.
        createdAt:
          type: integer
          format: int64
          description: Secret content corresponding to the version creation timestamp.
      example:
        secretName: mySecret
        version: 0
        createdBy: 'aprn:apple:certmgr:::group-v1:/ig/5615404/uv'
        createdAt: 1528479274628
    SetSecretVersionRequest:
      type: object
      properties:
        version:
          description: Secret content version to be set as current version.
          type: integer
          format: int64
      required:
        - version
      example:
        version: 1
    StatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/Status'
        message:
          type: string
          description: Message explaining the status.
        results:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StatusResponseResult'
      example:
        status: ok
        message: ok
        results:
          cassandraStatus:
            healthy: true
            time: 1666643268383
            duration: 2
            timestamp: 2022-10-24T20:27:48.383Z
          deadlocks:
            healthy: true
            time: 1666643268384
            duration: 0
            timestamp: 2022-10-24T20:27:48.384Z
    UpdateBucketRequest:
      type: object
      properties:
        updatedDescription:
          $ref: '#/components/schemas/Description'
        updatedMetadata:
          $ref: '#/components/schemas/Metadata'
      example:
        updatedDescription: "Just a run-of-the-mill bucket"
        updatedMetadata: "{}"
    UpdateSecretRequest:
      type: object
      properties:
        updatedDescription:
          $ref: '#/components/schemas/Description'
        updatedContent:
          maxLength: 1398101
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
          description: |-
            base64 encoded new secret content
            Example:
            > echo 'my-r0t4t3d-p4ssw0rd' | base64
            bXktcjB0NHQzZC1wNHNzdzByZAo=
          format: byte
        updatedMetadata:
          $ref: '#/components/schemas/Metadata'
        policies:
          description: New list of policies for the Secret.
          type: array
          items:
            $ref: '#/components/schemas/PolicyName'
      example:
        updatedDescription: Just a rotated secret
        updatedContent: bXktcjB0NHQzZC1wNHNzdzByZAo=
        updatedMetadata: "{}"
    Policy:
      type: object
      properties:
        namespace:
          $ref: '#/components/schemas/NamespaceName'
        policyName:
          $ref: '#/components/schemas/PolicyName'
        policyType:
          $ref: '#/components/schemas/PolicyType'
        policyData:
          type: object
          description: Policy Data. Schema of policy data is determined by policy type.
        createdAt:
          type: integer
          format: int64
        createdBy:
          type: string
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
      example:
          namespace: myNamespace,
          policyName: myPolicy,
          policyType: SECRET_GENERATION,
          policyData:
            secretGenerationRule:
              minDigits: 1
              minLength: 8
              maxLength: 20
              minNumberOfUpperCases: 1
              minNumberOfLowerCases: 1
              minNumberOfSpecialChars: 1
              includeSpecialChars: true
              allowedSpecialCharacters: "@#$%^&!?*-_=+.,:;~(){}[]<>"
          createdAt: 1670289796088
          createdBy: "aprn:apple:certmgr:::group-v2:/ig/1111111/uv/"
    CreatePolicyRequest:
      type: object
      properties:
        policyName:
          $ref: '#/components/schemas/PolicyName'
        policyType:
          $ref: '#/components/schemas/PolicyType'
        policyData:
          description: 'Policy Data. Schema of policy data is determined by policy type.\n
          "policyData" must not be null, but can be an empty object which will result in a policy without any rule.\n
          "policyData" can have an empty "secretGenerationRule" (if the "policyType" is "SECRET_GENERATION") object which will result in a policy with default "secretGenerationRule".'
          oneOf:
          -  $ref: '#/components/schemas/SecretGenerationPolicyType'
      required:
        - policyName
        - policyType
        - policyData
      example:
        policyName: myPolicy
        policyType: "SECRET_GENERATION"
        policyData:
          secretGenerationRule:
            minDigits: 1
            minLength: 8
            maxLength: 20
            minNumberOfUpperCases: 1
            minNumberOfLowerCases: 1
            minNumberOfSpecialChars: 1
            includeSpecialChars: true
            allowedSpecialCharacters: "@#$%^&!?*-_=+.,:;~(){}[]<>"

    SecretGenerationPolicyType:
        type: object
        properties:
          secretGenerationRule:
            type: object
            properties:
              minLength:
                type: integer
                format: int32
                minimum: 4
                maximum: 64
              maxLength:
                type: integer
                format: int32
                minimum: 4
                maximum: 64
              minNumberOfUpperCases:
                type: integer
                format: int32
                minimum: 1
                maximum: 64
              minNumberOfLowerCases:
                type: integer
                format: int32
                minimum: 1
                maximum: 64
              minDigits:
                type: integer
                format: int32
                minimum: 1
                maximum: 64
              includeSpecialChars:
                type: boolean
                description: if set to false, generated secrets will not include special characters
              minNumberOfSpecialChars:
                type: integer
                format: int32
                minimum: 1
                maximum: 64
              allowedSpecialCharacters:
                type: string
                description: "Allowed special characters are: @#$%^&!?*-_=+.,:;~(){}[]<>"

    UpdatePolicyRequest:
      type: object
      properties:
        policyType:
          $ref: '#/components/schemas/PolicyType'
        policyData:
          description: Policy Data. Schema of policy data is determined by policy type.
          oneOf:
            - $ref: '#/components/schemas/SecretGenerationPolicyType'
      required:
        - policyType
        - policyData
      example:
        policyType: "SECRET_GENERATION"
        policyData:
          secretGenerationRule:
            minDigits: 1
            minLength: 8
            maxLength: 20
            minNumberOfUpperCases: 1
            minNumberOfLowerCases: 1
            minNumberOfSpecialChars: 1
            includeSpecialChars: true
            allowedSpecialCharacters: "@#$%^&!?*-_=+.,:;~(){}[]<>"
    RoleBinding:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/RoleType'
        principals:
          description: List of Principal names in APRN format.
          type: array
          items:
            $ref: '#/components/schemas/APRN'
      required:
        - name
        - principals
      example:
        name: admin
        principals: [
          "aprn:apple:certmgr:::group-v2:/ig/11111111/uv/"
        ]

    CreateNamespaceRequest:
      type: object
      properties:
        description:
          $ref: '#/components/schemas/Description'
    UpdateNamespaceRequest:
      type: object
      properties:
        description:
          $ref: '#/components/schemas/Description'
      required:
        - description
    UpdatePrincipalRequest:
      type: object
      properties:
        roles:
          $ref: '#/components/schemas/NamespaceRoles'
      required:
        - roles
    RoleType:
      type: string
      description: 'Name of the role. Supported values are: "admin", "auditor".'
    PolicyType:
      type: string
      description: 'Type of policy. Supported values are: "SECRET_GENERATION".'
    Status:
      type: string
      description: 'Status of the service. Supported values are: "ok", "critical".'

    SecretName:
      description: Name of the Secret.
      type: string
      pattern: ^[a-zA-Z_0-9\-:][a-zA-Z_0-9\-.:]+$
      maxLength: 256
    BucketName:
      description: Name of the Bucket.
      type: string
      pattern: ^[a-zA-Z_0-9\-:][a-zA-Z_0-9\-.:]+$
      maxLength: 256
    PolicyName:
      description: Name of the Policy.
      type: string
      minLength: 3
      maxLength: 256
      # must begin with a letter and end with a letter or a number.
      # must consist only lowercase letters, numbers, dots (.), and hyphens (-).
      pattern: ^[a-zA-Z][a-zA-Z_0-9\-.:]+[a-zA-Z0-9]$
    Description:
      type: string
      maxLength: 1024
    Metadata:
      type: string
      maxLength: 2048
    APRN:
      description: Name of the Principal in APRN format.
      type: string
      pattern: '^aprn:.+'
    PrincipalName:
      description: Name of the Principal in APRN or legacy format. Legacy Principal format is allowed only in legacy Namespaces.
      type: string
      pattern: '(^aprn:.+)|(.+:.+)'
    NamespaceName:
      description: Name of the namespace
      type: string
      pattern: '([0-9]+)|(^[a-z].*[a-z0-9]$)|(default)'
    CustomNamespaceName:
      description: Name of the custom namespace
      type: string
      pattern: ^(?!default$)[a-z][a-z0-9.-]{1,62}[a-z0-9]$
    NamespaceRoles:
      description: List of roles
      type: array
      items:
        $ref: '#/components/schemas/RoleType'
  parameters:
    namespaceParam:
      name: namespace
      in: query
      description: "namespace, if not specified, legacy namespace derived from the\
                        \ client certificate."
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/NamespaceName'
  responses:
    TooManyRequests:
      description: The rate limit for this API has been exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/runtimeError'
    Unauthorized:
      description: Request does not contain valid authentication data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/runtimeError'

