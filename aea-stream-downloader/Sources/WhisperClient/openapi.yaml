openapi: 3.0.0
info:
  title: Whisper API
  contact:
    name: Whisper
    email: whisper@group.apple.com
  version: "2.1.2"
servers:
  - url: https://whisper.iss.apple.com
    description: Whisper AODC partition
  - url: https://whisper.isg.apzones.com
    description: Whisper APZ partition
  - url: https://whisper-gg.isg.apzones.com
    description: Whisper GG partition
paths:
  /v1/version:
    get:
      tags:
        - version
      summary: Returns whisper server version information.
      operationId: version
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /status:
    get:
      tags:
        - Healthcheck
      summary: Returns whisper service health information.
      operationId: Status
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/namespaces:
    get:
      tags:
        - Namespaces
      summary: List namespaces
      description: Lists the namespaces in which the caller has admin/auditor role. Policy APRNs are not supported due to operational complexities. Note that namespaces to which the caller is granted admin role through policy APRNs only will not be included.
      operationId: ListNamespaces
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NamespaceListItem'
                x-content-type: application/json
        "401":
          $ref: '#/components/responses/Unauthorized'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/namespaces/{namespace_name}:
    get:
      tags:
        - Namespaces
      summary: Describes the details of a specific namespace.
      parameters:
        - name: namespace_name
          in: path
          description: "Name of the namespace."
          example: myNamespace
          required: true
          style: simple
          explode: false
          schema:
            $ref: '#/components/schemas/NamespaceName'
        - name: additional-roles
          in: query
          description: 'Roles to be returned in addition to "admin". Currently Supported value is "all". Unrecognized value will be ignored'
          example: all
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      operationId: DescribeNamespace
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeNamespaceResponse'
        "400":
          description: Invalid input parameters values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin/auditor role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    put:
      tags:
        - Namespaces
      summary: Updates information about a namespace.
      parameters:
        - name: namespace_name
          in: path
          description: "Name of the namespace."
          example: myNamespace
          required: true
          style: simple
          explode: false
          schema:
            $ref: '#/components/schemas/NamespaceName'
      operationId: UpdateNamespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNamespaceRequest'
      responses:
        "204":
          description: A successful response.
          content: {}
        "400":
          description: Invalid request data or input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Request body not present or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
        - Namespaces
      summary: Creates a new custom namespace.
      description: "Note: Legacy namespaces cannot be created."
      parameters:
        - name: namespace_name
          in: path
          description: "Name of the namespace."
          example: myNamespace
          required: true
          style: simple
          explode: false
          schema:
            $ref: '#/components/schemas/CustomNamespaceName'
      operationId: CreateNamespace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNamespaceRequest'
      responses:
        "201":
          description: A successful response.
          content: {}
        "400":
          description: Invalid request data or input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: Namespace with the given name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Request body not present or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - Namespaces
      summary: Deletes the given custom namespace.
      description: 'A namespace cannot be deleted if it has secrets, buckets or policies. Note: Legacy namespaces cannot be deleted.'
      parameters:
        - name: namespace_name
          in: path
          description: "Name of the namespace."
          example: myNamespace
          required: true
          style: simple
          explode: false
          schema:
            $ref: '#/components/schemas/CustomNamespaceName'
      operationId: DeleteNamespace
      responses:
        "204":
          description: A successful response.
          content: { }
        "400":
          description: Invalid parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/namespaces/{namespace_name}/roles/{role}/principals/{principal_name}:
    parameters:
      - name: namespace_name
        in: path
        description: Name of the namespace
        example: myNamespace
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/NamespaceName'
      - name: role
        in: path
        description: Name of the role
        example: admin
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/RoleType'
      - name: principal_name
        in: path
        description: APRN of the principal. Policy APRN for selected domains can also be specified.
        example: 'aprn:apple:certmgr:::group-v2:/ig/11111111/uv/'
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/APRN'
    put:
      tags:
        - Namespaces
      summary: Assigns role to a principal.
      operationId: AssignRole
      responses:
        "204":
          description: A successful response. If role is already assigned to the principal, server will still return this response.
          content: {}
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - Namespaces
      summary: Unassigns role from a principal.
      operationId: UnassignRole
      responses:
        "204":
          description: A successful response.
          content: {}
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Invalid role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/namespaces/{namespace_name}/principals/{principal_name}:
    parameters:
      - name: namespace_name
        in: path
        description: "Name of the namespace."
        example: myNamespace
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/NamespaceName'
      - name: principal_name
        in: path
        description: APRN of the principal. Policy APRN for selected domains can also be specified.
        example: 'aprn:apple:certmgr:::group-v2:/ig/11111111/uv/'
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/APRN'
    put:
      tags:
        - Namespaces
      summary: Create or update principal in a namespace
      operationId: CreateOrUpdatePrincipal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrincipalRequest'
      responses:
        "204":
          description: A successful response. If role(s) are already assigned to the principal, server will still return this response.
          content: { }
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'

  /v1/secrets:
    parameters:
      - $ref: '#/components/parameters/namespaceParam'
    get:
      tags:
        - Secrets
      summary: Lists secrets in a namespace.
      description: Secret content is not
        included.
      operationId: ListSecrets
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListSecretItem'
                x-content-type: application/json
        "400":
          description: Invalid parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: 'Caller does not have admin/auditor role or the namespace with the given name not found. 
         If the namespace is a custom namespace, a user with read access to secrets through bucket(s) in that namespace is also authorized to perform this operation. Only the secrets accessible to the user will be returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    put:
      tags:
        - Secrets
      summary: Creates a new secret.
      description: "A secret can be created either using specified content in the request or using Whisper generated contents. To let Whisper generate secret content, use the following guidelines:\n
      * Create SECRET_GENERATION type policy (or use one if already created).\n 
      * Provide the policy name as policies without adding content in the request.\n  
      * If the content field is also provided, it takes precedence and Whisper will not generate the secret; instead the supplied content will be used to create the secret."
      operationId: CreateSecret
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecretRequest'
        required: true
      responses:
        "201":
          description: A successful response.
          content: {}
        "400":
          description: Invalid request data or parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "409":
          description: Secret with the given name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Request body not present or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/secrets/{secret_name}:
    parameters:
      - name: secret_name
        in: path
        description: Name of the secret.
        example: mySecret
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/SecretName'
      - $ref: '#/components/parameters/namespaceParam'
    get:
      tags:
        - Secrets
      summary: Describes a secret.
      description: Returns information about a secret. Secret content is not included.
      operationId: ReadSecret
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadSecretResponse'
        "400":
          description: Invalid request data or input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin/auditor role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Secret with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
        - Secrets
      summary: Updates a secret and set it as the current version.
      operationId: UpdateSecret
      parameters:
        - name: preserveCurrentVersion
          in: query
          description: "By default, when updating secret content, the new version will be set as current. 
          However, you can provide this optional query parameter as true to prevent this. 
          This parameter has no effect when secret content is not being updated."
          example: true
          required: false
          style: form
          explode: true
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
        required: true
      responses:
        "200":
          description: A successful response.
          content: { }
        "400":
          description: Invalid request data or input parameters value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Secret with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Request body not present or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    delete:
      tags:
        - Secrets
      summary: Deletes a secret.
      operationId: DeleteSecret
      responses:
        "200":
          description: A successful response.
          content: { }
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Secret with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/secrets/{secret_name}/versions:
    parameters:
      - name: secret_name
        example: mySecret
        in: path
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/SecretName'
      - $ref: '#/components/parameters/namespaceParam'
    get:
      tags:
        - Secrets
      summary: Lists versions for a secret.
      operationId: ListSecretVersions
      responses:
        "200":
          description: A successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListSecretVersionsItem'
                x-content-type: application/json
        "400":
          description: Invalid input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: 'Caller does not have admin/auditor role or the namespace with the given name not found. 
          If the namespace is a custom namespace, a user with read access to the secrets through bucket(s) in that namespace is also authorized to call this operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Secret with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
    post:
      tags:
        - Secrets
      summary: Sets a given version of a secret as current version.
      operationId: SetSecretVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretVersionRequest'
        required: true
      responses:
        "200":
          description: A successful response.
          content: { }
        "400":
          description: Invalid request data or input parameters value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: Caller does not have admin role or the namespace with the given name not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "404":
          description: Secret content with the given name and version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "422":
          description: Request body not present or is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtimeError'
  /v1/secrets/{secret_name}/rotate:
    parameters:
      - name: secret_name
        example: mySecret
        in: path
        required: true
        style: simple
        explode: false
        schema:
          $ref: '#/components/schemas/SecretName'
