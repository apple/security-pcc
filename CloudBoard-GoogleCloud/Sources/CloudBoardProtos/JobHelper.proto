/**
 * JobHelper API — gRPC interface between cloudboardd and cb_jobhelper.
 *
 * cloudboardd pre-warms cb_jobhelper instances and delegates per-request
 * processing (OHTTP decryption, PCC protocol, chunking, cloud app
 * communication) over this interface.
 */
syntax = "proto3";

package com.apple.cloudboard.jobhelper.v1;

option java_multiple_files = true;
option java_package = "com.apple.cloudboard.jobhelper.v1";
option swift_prefix = "Proto_JobHelper_";

import "CloudBoard.proto";

service JobHelper {
    rpc InvokeWorkload (stream InvokeWorkloadRequest) returns (stream InvokeWorkloadResponse);
}

message InvokeWorkloadRequest {
    // Sent first by cloudboardd to trigger cb_jobhelper + cloud app warmup.
    message WarmupContext {
        // Unix domain socket path via which cb_jobhelper connects to the cloud app.
        string cloud_app_socket_path = 1;
    }

    // Sent after warmup completes, carries the ROPES parameters needed to
    // process the request (request_id, decryption_key, tenant_info, etc.).
    message ConnectionContext {
        com.apple.cloudboard.api.v1.InvokeWorkloadRequest.Parameters parameters = 1;

        // WSD key handle (UUID string). cb_jobhelper uses this to perform decap
        // operations via the WSD.
        string key_handle = 2;
    }

    // An encrypted request chunk forwarded as-is from ROPES.
    message RequestChunk {
        bytes encrypted_payload = 1;
        bool is_final = 2;
    }

    // Signals cb_jobhelper to shut down gracefully. Can be sent at any point in the lifecycle
    // (post-warmup, mid-streaming).
    message Terminate {
        string reason = 1;
    }

    oneof type {
        WarmupContext warmup_context = 1;
        ConnectionContext connection_context = 2;
        RequestChunk request_chunk = 3;
        Terminate terminate = 4;
    }
}

message InvokeWorkloadResponse {
    // cb_jobhelper + cloud app warmup is complete; ready for a request.
    message WarmupComplete {
    }

    // An encrypted response chunk to forward back to ROPES.
    message ResponseChunk {
        bytes encrypted_payload = 1;
        bool is_final = 2;
    }

    message Error {
        string message = 1;
    }

    // Sent by cb_jobhelper once cloud app has finished, indicating that any shared resources have been freed (can be
    // assumed to have been freed in case of an unclean cloud app termination), and that additional requests can be
    // accepted. Sent after both normal request completion and forced termination.
    message Completed {
        enum Status {
            UNKNOWN = 0;
            CLEAN = 1;
            UNCLEAN = 2;
        }
        Status status = 1;
    }

    oneof type {
        WarmupComplete warmup_complete = 1;
        ResponseChunk response_chunk = 2;
        Error error = 3;
        Completed completed = 4;
    }
}
