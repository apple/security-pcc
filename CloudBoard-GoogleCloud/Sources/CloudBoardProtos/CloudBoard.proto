/**
 * CloudBoard API
 */
syntax = "proto3";

package com.apple.cloudboard.api.v1;

option java_multiple_files = true;
option java_package = "com.apple.cloudboard.api.v1";
option swift_prefix="Proto_CloudBoard_";

import "google/protobuf/timestamp.proto";
import "RopesCommon.proto";

service CloudBoard {
    rpc InvokeWorkload (stream InvokeWorkloadRequest) returns (stream InvokeWorkloadResponse);

    rpc WatchAttestation (WatchAttestationRequest) returns (stream WatchAttestationResponse);

    rpc WatchLoadLevel (LoadRequest) returns (stream LoadResponse);
}

message TraceContext  {
  // Request tracking identifier.
  // It is a UUID generated by the client and passed to ROPES through the "apple-request-uuid" header.
  UUID trace_id = 1;
  // 8-byte identifier generated by ROPES or Trusted Proxy.
  fixed64 span_id = 2;
  optional fixed64 parent_span_id = 3;
}

message UUID {
    fixed64 most_sig_bits = 1;
    fixed64 least_sig_bits = 2;
}

message AffinityKey {
    enum Category {
        CATEGORY_UNSPECIFIED = 0;
        CATEGORY_INFERENCE_ID = 1;
    }
    Category category = 1;
    fixed64 data = 2;
}

message InvokeWorkloadRequest {
    message Setup {
        // CloudBoard should reject the request if this field is set, and the current batch size
        // before accepting the request is greater than this value.
        // Used to prevent herding effect when few nodes have a current batch size smaller than their optimal batch size.
        optional uint32 max_accepted_current_batch_size = 1;
    }

    message Terminate {
        enum Code {
            UNDEFINED         = 0;
            FOUND_OTHER_NODE  = 1;
            CLIENT_ABORTED    = 2;
            SERVER_ERROR      = 3;
        }
        Code code = 1;
        optional string reason = 2;
        optional com.apple.ropes.common.v1.ClientTerminate client_terminate = 3;
    }

    message Parameters {
        // Relevant to proxy nodes only
        reserved 6, 7, 8, 9, 12;
        // Deprecated, no longer in use
        reserved 10;
        com.apple.ropes.common.v1.Workload workload            = 1;
        com.apple.ropes.common.v1.DecryptionKey decryption_key = 2;
        string request_id                                      = 3;
        com.apple.ropes.common.v1.TenantInfo tenant_info       = 4;
        bytes one_time_token                                   = 5;
        TraceContext trace_context                             = 11;
        
        // Opaque hints used by ROPES to implement affinity.
        // ROPES prefers nodes that are already handling a request with the same affinity_keys.
        // CloudBoard treats this value as opaque and echoes the set of affinity_keys of all
        // pending inference requests back to ROPES via LoadResponse.pending_affinity_keys.
        repeated AffinityKey affinity_key = 13;

    }

    oneof type {
        Setup setup                                   = 1;
        Terminate terminate                           = 2;
        com.apple.ropes.common.v1.Chunk request_chunk = 3;
        Parameters parameters                         = 4;
    }
}

message InvokeWorkloadResponse {
    // Only relevant for proxy nodes
    reserved 3, 4;
    
    message SetupAck {
        // Only relevant for proxy nodes
        reserved 2, 3;
        // When CloudBoard sets the field to true, ROPES sends Terminate message before cancelling the stream of
        // invokeWorkload.
        bool support_terminate = 1;
        
        // // When set, ROPES expects the ensemble instance ID and rack ID to be advertised in ServiceDiscovery
        bool support_routing_v2 = 4;

        // When true, CloudBoard supports the new TraceContext format with UUID trace_id
        // and fixed64 span_id fields instead of the deprecated string-based TraceContextV1.
        bool support_tracing_context_v2 = 5;
        
        // Current batch size before accepting the request. Used for reporting purposes.
        // It should be roughly equal to LoadResponse.current_batch_size, but is more up-to-date.
        optional uint32 current_batch_size = 6;
    }

    oneof type {
        SetupAck setup_ack                                                      = 1;
        com.apple.ropes.common.v1.Chunk response_chunk                          = 2;
        com.apple.ropes.common.v1.RequestExecutionError request_execution_error = 5;
    }
}

message LoadRequest {
}

message LoadResponse {
    uint32 max_batch_size                                = 1;
    uint32 current_batch_size                            = 2;
    uint32 optimal_batch_size                            = 3;
    optional com.apple.ropes.common.v1.Workload workload = 4 [deprecated = true];

    // Affinity keys of requests in progress on this node, as provided by clients via
    // InvokeWorkloadRequest.Parameters.affinity_key. These values are opaque to CloudBoard,
    // but CloudBoard must remove duplicate affinity keys.
    repeated AffinityKey affinity_keys_in_progress       = 5;
}

message WatchAttestationRequest {
}

message WatchAttestationResponse {

    message AttestationMetadata {
        message Release {
            // hex-encoded SHA256 digest of a transparency log entry/release that uniquely identifies
            // a release associated with an attestation. Compute ensembles announce the
            // release they are running to Service Discovery using the same digest.
            string digest = 1;
        }

        bytes key_id = 1;
        // One or more compute ensemble releases associated with the attestation
        // Currently only ever used by proxy nodes
        //
        // Note: Always empty on compute nodes
        repeated Release supported_release = 2;
        // The attestation hard expires at this point
        // there is no point passing a request using it to this node
        google.protobuf.Timestamp expires_after = 3;
        // Transparency log tree ID from the attestation bundle's transparency proofs
        optional uint64 transparency_tree_id = 4;
        // Transparency log revision number within that tree from the attestation bundle's transparency proofs
        optional uint64 transparency_revision = 5;
    }

    // Represents an attestation/key to be published to clients
    message ActiveAttestation {
        bytes attestation_bundle = 1;
        AttestationMetadata attestation_metadata = 2;
    }

    message AttestationSet {
        ActiveAttestation active_attestation = 1;

        // Represents attestations that are no longer published to
        // ROPES but that are still accepted by the node
        repeated AttestationMetadata unpublished_attestations = 2;
    }

    message AttestationRevocation {
        bytes key_id = 1;
        bytes revocation = 2;
        google.protobuf.Timestamp expiration_time = 3;
    }

    oneof type {
        AttestationSet attestation_set = 1;
        AttestationRevocation attestation_revocation = 2;
    }
}
