/**
 * CloudApp API
 */
syntax = "proto3";

package com.apple.cloudboard.api.v1;

option java_multiple_files = true;
option java_package = "com.apple.cloudboard.api.v1";
option swift_prefix="Proto_CloudApp_";

service CloudApp {
    rpc InvokeWorkload (stream InvokeWorkloadRequest) returns (stream InvokeWorkloadResponse);
}

message UUID {
    fixed64 most_sig_bits = 1;
    fixed64 least_sig_bits = 2;
}

message TraceContext {
    // Request tracking identifier.
    // It is a UUID generated by the client and passed to ROPES through the "apple-request-uuid" header.
    UUID trace_id = 1;
    // 8-byte identifier generated by ROPES or Trusted Proxy.
    fixed64 span_id = 2;
    optional fixed64 parent_span_id = 3;
}

message InvokeWorkloadRequest {
    message WarmupContext {
        // ID used to correlate observability from CloudBoard pre-warm pool, cb-jobhelper and CloudApp.
        int64 node_resource_id = 1;
    }

    message OpaqueCryptoMaterial {
        string id = 1;
        bytes material = 2;
    }

    message ConnectionContext {
        message WorkloadParameter {
            string key = 1;
            repeated string value = 2;
        }

        string request_id = 1;
        string bundle_id = 2;
        string bundle_version = 3;
        string feature_id = 4;
        string client_info = 5;
        string workload_type = 6;
        repeated WorkloadParameter workload_parameters = 7;
        string automated_device_group = 8;
        TraceContext trace_context = 9;
    }

    message SubRequestContext {
        uint32 sub_request_id = 1;
        repeated OpaqueCryptoMaterial opaque_crypto_material = 2;
    }

    message SubRequestInputData {
        uint32 sub_request_id = 1;
        bytes message = 2;
    }

    message SubRequestEndOfInput {
        uint32 sub_request_id = 1;
    }

    // Signals the cloud app to shut down gracefully. Can be sent at any point
    // in the lifecycle (pre-warmup, post-warmup, mid-streaming).
    message Terminate {
        string reason = 1;
    }

    message KeyDerivationResult {
        uint64 derivation_id = 1;
        oneof outcome {
            bytes derived_key = 2;
            string error = 3;
        }
    }

    oneof type {
        WarmupContext warmup_context = 1;
        ConnectionContext connection_context = 2;
        SubRequestContext sub_request_context = 3;
        SubRequestInputData sub_request_input_data = 4;
        SubRequestEndOfInput sub_request_end_of_input = 5;
        Terminate terminate = 6;
        KeyDerivationResult key_derivation_result = 7;
    }
}

message InvokeWorkloadResponse {
    message WarmupComplete {
    }

    message ResponseOutputData {
        uint32 sub_request_id = 1;
        bytes message = 2;
    }

    message ResponseEndOfOutput {
        message Success {
        }

        message Error {
            string message = 1;
        }

        uint32 sub_request_id = 1;
        oneof type {
            Success success = 2;
            Error error = 3;
        }
    }

    // Sent by the cloud app once all resources have been freed.
    // Sent after both normal request completion and forced termination.
    message CloudAppComplete {
        message Success {
        }

        message Error {
            string message = 1;
        }

        oneof type {
            Success success = 1;
            Error error = 2;
        }
    }

    message KeyDerivationRequest {
        uint64 derivation_id = 1;
        string info = 2;
        uint32 output_byte_count = 3;
    }

    oneof type {
        WarmupComplete warmup_complete = 1;
        ResponseOutputData response_output_data = 2;
        ResponseEndOfOutput response_end_of_output = 3;
        CloudAppComplete cloud_app_complete = 4;
        KeyDerivationRequest key_derivation_request = 5;
    }
}
